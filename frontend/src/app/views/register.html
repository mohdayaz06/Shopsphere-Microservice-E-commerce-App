<div class="auth-shell">
  <div class="auth-card">
    <h2>Create your account</h2>
    <p class="sub">Join ShopSphere and start shopping in minutes.</p>

    <div class="alert alert-danger" ng-if="vm.errorMessage">{{ vm.errorMessage }}</div>

    <form name="registerForm" novalidate ng-submit="vm.submit(registerForm)">
      <div class="form-group">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" name="fullName" class="form-control"
          ng-model="vm.form.fullName" required maxlength="120" placeholder="Ananya Iyer" />
      </div>

      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" class="form-control"
          ng-model="vm.form.email" required placeholder="you@example.com" />
      </div>

      <div class="form-group">
        <label for="phone">Phone (optional)</label>
        <input type="tel" id="phone" name="phone" class="form-control"
          ng-model="vm.form.phone" placeholder="+91 98765 43210" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control"
          ng-model="vm.form.password" ng-change="vm.onPasswordChange()"
          required minlength="8" placeholder="At least 8 characters" />
        <div class="strength-meter" ng-class="vm.passwordStrength.className" ng-if="vm.form.password" style="display:flex; gap:4px; margin-top:6px;">
          <div ng-repeat="i in [1,2,3,4,5]" style="height:4px; flex:1; border-radius:2px; background:var(--c-border);"
            ng-class="{'strength-fill': $index < vm.passwordStrength.score}"></div>
        </div>
        <div class="hint" style="font-size:0.76rem; color:var(--c-ink-muted); margin-top:4px;" ng-if="vm.passwordStrength.label">{{ vm.passwordStrength.label }} password</div>
        <div class="hint" style="font-size:0.76rem; color:var(--c-ink-muted); margin-top:4px;" ng-if="!vm.form.password">Must include an uppercase letter and a number.</div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
          ng-class="{'is-invalid': vm.confirmPassword && vm.confirmPassword !== vm.form.password}"
          ng-model="vm.confirmPassword" required placeholder="Re-enter your password" />
        <div class="field-error" ng-if="vm.confirmPassword && vm.confirmPassword !== vm.form.password">Passwords do not match.</div>
      </div>

      <button type="submit" class="btn btn-accent btn-block" ng-disabled="vm.isSubmitting">
        <span class="spinner" ng-if="vm.isSubmitting"></span>
        <span ng-if="!vm.isSubmitting">Create account</span>
        <span ng-if="vm.isSubmitting">Creating account...</span>
      </button>
    </form>

    <p class="text-muted" style="margin-top:22px; font-size:0.85rem; color:var(--c-ink-muted); text-align:center;">
      Already have an account? <a href="#!/login" style="color:var(--c-accent); font-weight:600;">Sign in</a>
    </p>
  </div>
</div>
